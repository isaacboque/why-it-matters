<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhyItMatters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">WhyItMatters<small>synthetic data only</small></div>
    <div class="controls">
      <label>Match seed <input id="seed" type="number" min="0" max="100000" value="7"></label>
      <label>Pace
        <select id="pace">
          <option value="180">Live (~3 min)</option>
          <option value="45">Fast (45 s)</option>
          <option value="0">Instant</option>
        </select>
      </label>
      <label><input id="faults" type="checkbox"> Unreliable model</label>
      <button id="start" class="primary">Kick off</button>
    </div>
    <div class="badge" id="badge" title="Share of generated claims that matched the match state">
      <span class="dot"></span><span>Truth Score <b id="badge-score">100%</b></span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-studio" data-view="studio" aria-selected="true">Studio</button>
    <button class="tab" role="tab" id="tab-fan" data-view="fan" aria-selected="false">Fan</button>
    <button class="tab" role="tab" id="tab-trust" data-view="trust" aria-selected="false">Trust</button>
  </nav>

  <main>
    <section id="view-studio" class="view active" role="tabpanel" aria-labelledby="tab-studio">
      <div class="scoreboard" id="scoreboard-studio"></div>
      <div class="studio-grid">
        <div>
          <div class="card">
            <h2>Pitch</h2>
            <canvas id="pitch" aria-label="Recent events on the pitch"></canvas>
            <div class="legend" id="pitch-legend"></div>
          </div>
          <div class="card">
            <h2>Match Pulse</h2>
            <canvas id="pulse" aria-label="Dominance and chaos over time"></canvas>
            <div class="legend" id="pulse-legend"></div>
          </div>
        </div>
        <div class="card">
          <h2>On air</h2>
          <div class="rail" id="rail" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section id="view-fan" class="view" role="tabpanel" aria-labelledby="tab-fan">
      <div class="scoreboard" id="scoreboard-fan"></div>
      <div class="fan-controls">
        <label><span id="l-lang">Language</span>
          <select id="f-lang"><option value="en">English</option><option value="es">Español</option><option value="ca">Català</option></select></label>
        <label><span id="l-mode">Show me</span>
          <select id="f-mode"></select></label>
        <label><span id="l-club">My club</span>
          <select id="f-club"></select></label>
        <label><span id="l-player">My player</span>
          <select id="f-player"></select></label>
      </div>
      <div class="fan-feed rail" id="fan-feed" aria-live="polite"></div>
    </section>

    <section id="view-trust" class="view" role="tabpanel" aria-labelledby="tab-trust">
      <div class="trust-grid" id="trust-grid"></div>
      <h2 style="margin-top:16px">Verifier log</h2>
      <div class="verdicts" id="verdicts"></div>
    </section>
  </main>

  <footer>All clubs, players and matches are fictional and generated by code. No real league data, footage or marks.</footer>

  <dialog id="why"><div class="inner" id="why-body"></div></dialog>
  <dialog id="recap"><div class="inner recap" id="recap-body"></div></dialog>

  <script src="app.js"></script>
</body>
</html>
