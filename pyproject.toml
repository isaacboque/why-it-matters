[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whyitmatters"
version = "0.1.0"
description = "Explainable match intelligence from synthetic football events."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["openai>=1.40"]  # only for WIM_GENERATOR=llm; tests use fake clients and never need it
maf = ["agent-framework-core>=1.20"]  # Microsoft Agent Framework engine (WIM_ENGINE=agent_framework)
dev = [
    "pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29",
    "agent-framework-core>=1.20", "playwright>=1.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whyitmatters = ["pulse/xt_grid.json", "simulator/featured.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: browser tests (Playwright + Chromium); run with `pytest -m e2e`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
